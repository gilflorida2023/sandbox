scout:
  host: "localhost"
  port: 8080
  base_url: "http://localhost:8080/cgi-bin/mcp/tools"

ollama:
  host: "localhost"
  port: 11434
  model: "glm4:9b"
  timeout: 600

workspace:
  path: "/home/scout/projects/sandbox/workspace"
  wiki_path: "/home/scout/projects/sandbox/workspace/.wiki"

agent:
  max_turns: 20
  temperature: 0.1
  max_context_tokens: 2000

  knowledge:
    ingest_on_startup: false
    require_user_approval: true
    blacklist:
      - simplesieve
      - primesieve
      - prime sieve
      - sieve of eratosthenes
    blacklist_regex: []
    max_chunks_per_session: 50

  context:
    session_tokens: 500
    conversation_tokens: 500
    knowledge_tokens: 500
    task_tokens: 500

embedding:
  model: "nomic-embed-text"
  host: "localhost"
  port: 11434

vector_store:
  storage_path: "/home/scout/projects/sandbox/workspace/.context/vectors"
  embedding_dim: 768

context:
  path: "/home/scout/projects/sandbox/workspace/.context"

phase3:
  session:
    storage_path: "/home/scout/projects/sandbox/workspace/.session_state"
    max_summary_tokens: 300
    keep_recent_turns: 4
    score_threshold: 0.55

  correction:
    storage_path: "/home/scout/projects/sandbox/workspace/.corrections"

  task:
    storage_path: "/home/scout/projects/sandbox/workspace/.tasks"
